name: Build Xovra Android preview

on:
  push:
    branches: [main, "codex/android-check", "codex/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: xovra-android-preview-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
