name: Publish Xovra Android stable release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Check signing secrets and prepare keystore
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret $name is missing." >&2
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xovra-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xovra-upload-key.jks" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify stable version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "android-v0.1.1" ]] || { echo "This workflow is configured for android-v0.1.1." >&2; exit 1; }
      - name: Build signed release APK
        run: gradle -p android-app :app:assembleRelease
      - name: Upload signed APK for release
        uses: actions/upload-artifact@v4
        with:
          name: xovra-android-stable
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Android stable release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: xovra-android-stable
          path: release-assets
      - name: Prepare release assets
        run: |
          mv release-assets/app-release.apk release-assets/Xovra-Android-0.1.1.apk
          cp android-app/THIRD-PARTY-NOTICES.md release-assets/Xovra-Android-THIRD-PARTY-NOTICES.md
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Xovra Android 0.1.1" \
            --notes "First stable Xovra Android release. Signed APK for Android 10 and newer. Install over the Android preview only after uninstalling it first; preview and stable APKs use different signing certificates. Future stable updates can be installed over this version. Verify the APK with SHA256SUMS.txt."
