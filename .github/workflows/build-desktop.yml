name: Build Xovra desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          package_version="$(node -p "require('./package.json').version")"
          [[ "$version" == "$package_version" ]] || { echo "Tag v$version must match package.json version $package_version" >&2; exit 1; }
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build native packages
        run: npm run make:desktop
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build branded Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'out\make\inno' | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          '#define AppVersion "' + $version + '"' | Set-Content 'installer\version.iss' -Encoding utf8NoBOM
          & $iscc 'installer\windows.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xovra-${{ matrix.platform }}-${{ github.sha }}
          path: out/make/
          if-no-files-found: error
          retention-days: 30
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Download platform build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xovra-*-x64-${{ github.sha }}
          path: release-input
          merge-multiple: true
      - name: Prepare release installers and checksums
        run: |
          mkdir -p release-assets
          find release-input -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.deb' -o -iname '*.rpm' \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file")"
          done
          test -n "$(find release-assets -type f -print -quit)"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Xovra $version" \
            --notes "Xovra 0.1.7 brings a richer cream-and-lime clay finish across the media workspace, raised source chips, and deeper inset controls. Windows builds are currently unsigned. Verify downloaded files with SHA256SUMS.txt."
