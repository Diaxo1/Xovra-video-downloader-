name: Publish Xovra Android preview

on:
  push:
    tags: ['android-preview-*']

permissions:
  contents: write

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build preview APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload APK for release
        uses: actions/upload-artifact@v4
        with:
          name: xovra-android-preview
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Android preview release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Xovra
        uses: actions/checkout@v4
      - name: Download preview APK
        uses: actions/download-artifact@v4
        with:
          name: xovra-android-preview
          path: release-assets
      - name: Prepare release assets
        run: |
          mv release-assets/app-debug.apk release-assets/Xovra-Android-0.1.0-preview.apk
          cp android-app/THIRD-PARTY-NOTICES.md release-assets/Xovra-Android-THIRD-PARTY-NOTICES.md
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --prerelease \
            --title "Xovra Android 0.1.0 Preview" \
            --notes "Early Android preview for testing. This is a debug-signed APK, not a stable Android release or Play Store build. Install on Android 10 or newer. Android may ask you to allow installs from your browser. Future preview builds may require uninstalling this build before installing an update. Verify the APK with SHA256SUMS.txt."
